[project]
name = "pesquisa360"
version = "0.1.0"
description = "Projeto Pesquisa360"
authors = [
    {name = "Rafhael F e Silva"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[all] (>=0.116.1,<0.117.0)",
    "sqlalchemy (>=2.0.42,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "passlib[bcrypt] (<1.8)",
    "python-jose (>=3.5.0,<4.0.0)",
    "geoalchemy2 (>=0.18.0,<0.19.0)",
    "shapely (>=2.1.1,<3.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "geopy (>=2.4.1,<3.0.0)",
    "bcrypt (<4.1)",
    "pyproj (>=3.7.2)",
    "pyshp (>=2.3.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
