services:
  db:
    image: postgis/postgis:15-3.3 # Imagem oficial com PostgreSQL e PostGIS
    container_name: pesquisa360_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: pesquisa360_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - .:/app # Mapeia o código para hot-reload
    depends_on:
      db:
        condition: service_healthy # Garante que o DB esteja pronto antes de iniciar a API

  # Ingestor automatico do TSE (ADR-087). Fora do `up` padrao: so sobe com
  # `docker compose --profile tse up -d tse_ingestor`, e so ingere com
  # TSE_INGESTION_ENABLED=true no .env. Exige o banco no head atual.
  tse_ingestor:
    build: .
    container_name: pesquisa360_tse_ingestor
    profiles: ["tse"]
    command: ["python", "-m", "pesquisa360.services.tse.worker"]
    env_file:
      - .env
    volumes:
      - .:/app
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "pesquisa360.services.tse.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
